name: Set up quality checks
description: Install the locked dependencies with Node and Bun.
inputs:
  prepare:
    description: Generate Nuxt and ViteHub types.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      shell: bash
    - if: inputs.prepare == 'true'
      run: bun run postinstall
      shell: bash
