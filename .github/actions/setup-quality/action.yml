name: Set up quality checks
description: Install the locked dependencies with Node and Bun.
inputs:
  prepare:
    description: Generate Nuxt and ViteHub types.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version: '24'
        cache: true
        run-install: false
    - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      shell: bash
    - if: inputs.prepare == 'true'
      run: bun run postinstall
      shell: bash
