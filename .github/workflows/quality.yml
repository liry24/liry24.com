name: PR quality

on:
  pull_request:
  push:
    branches: [dev, 'renovate/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: bun run format:check
            prepare: 'false'
          - name: Lint
            command: bun run lint
            prepare: 'true'
          - name: Typecheck (Nuxt)
            command: bun run typecheck
            prepare: 'true'
          - name: Typecheck (tests)
            command: bun x tsc --noEmit -p tsconfig.tests.json
            prepare: 'true'
          - name: Vitest (Node)
            command: node node_modules/vitest/vitest.mjs run --project node --exclude 'tests/worker/**'
            prepare: 'true'
          - name: Vitest (Nuxt)
            command: node node_modules/vitest/vitest.mjs run --project nuxt
            prepare: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-quality
        with:
          prepare: ${{ matrix.prepare }}
      - run: ${{ matrix.command }}

  worker-build:
    name: Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-quality
      - run: bun run build
        env:
          APP_ENV: test
          LIRY24_TEST_LOCAL: 'true'
          LIRY24_DISABLE_CRON: 'true'
          BETTER_AUTH_SECRET: synthetic-ci-build-secret-0123456789
      - run: tar -czf worker-build.tar.gz .output
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: worker-build
          path: worker-build.tar.gz
          if-no-files-found: error
          retention-days: 2

  worker-checks:
    name: ${{ matrix.name }}
    needs: worker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Wrangler dry-run
            command: bun x wrangler deploy --dry-run --config .output/server/wrangler.json
            prepare: 'false'
          - name: Worker tests
            command: node node_modules/vitest/vitest.mjs run tests/worker/
            prepare: 'true'
    env:
      LIRY24_TEST_BUILT_WORKER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-quality
        with:
          prepare: ${{ matrix.prepare }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: worker-build
      - run: tar -xzf worker-build.tar.gz
      - run: ${{ matrix.command }}

  mutation:
    name: Mutation (diff pilot)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-quality
        with:
          prepare: 'false'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .mutator
          key: mutator-${{ runner.os }}-${{ github.base_ref }}-${{ hashFiles('bun.lock', '*mutator.config.ts') }}-${{ github.sha }}
          restore-keys: |
            mutator-${{ runner.os }}-${{ github.base_ref }}-${{ hashFiles('bun.lock', '*mutator.config.ts') }}-
      - run: bun run test:mutation --since "$BASE_SHA" --include-test-changes --time-budget 300
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
