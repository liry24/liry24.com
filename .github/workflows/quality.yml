name: PR quality

on:
  pull_request:
  push:
    branches: [dev, 'renovate/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun run postinstall
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          LIRY24_TEST_LOCAL: 'true'
          LIRY24_TEST_CRON: 'true'
          APP_ENV: test
      - run: bun x playwright-core install --with-deps chromium
      - run: bun x vitest run tests/worker/built-app.test.ts tests/worker/native-app.test.ts tests/worker/adminComposer.browser.test.ts tests/worker/passkey.browser.test.ts
        env:
          LIRY24_TEST_BUILT_WORKER: 'true'
          LIRY24_TEST_ADMIN_COMPOSER_BROWSER: 'true'
      - name: Check native ViteHub development
        run: node scripts/test-liti-local.mjs
