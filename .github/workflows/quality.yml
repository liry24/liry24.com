name: PR quality

on:
  pull_request:
  push:
    branches: [dev, 'renovate/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun run postinstall
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Check local SQLite development
        env:
          BETTER_AUTH_SECRET: test-only-local-ci-secret-0123456789abcdef
          LIRY24_DEV_DB_PATH: ${{ runner.temp }}/liry24-local-test/database.sqlite
        run: |
          node node_modules/nuxt/bin/nuxt.mjs dev --host 127.0.0.1 --port 3101 > "$RUNNER_TEMP/nuxt-local.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true; wait "$dev_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/nuxt-local.log"' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3101/api/auth/get-session > /dev/null; then
              ready=true
              break
            fi
            kill -0 "$dev_pid" || exit 1
            sleep 1
          done
          test "$ready" = true
          node scripts/test-site-admin-local.mjs http://127.0.0.1:3101
