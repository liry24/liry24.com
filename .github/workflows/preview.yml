name: Dev Preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liry24-com-dev
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      APP_ENV: dev
      NODE_OPTIONS: --max-old-space-size=4096
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun --no-env-file install --frozen-lockfile
      - run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run build
      - name: Verify emitted Worker on isolated D1/R2
        run: bun x vitest run tests/worker/built-app.test.ts
        env:
          LIRY24_TEST_BUILT_WORKER: 'true'
      - name: Configure dev runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          NUXT_APP_SECRET: ${{ secrets.PREVIEW_NUXT_APP_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
          PREVIEW_GITHUB_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const keys = ['BETTER_AUTH_SECRET', 'NUXT_APP_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET', 'PREVIEW_GITHUB_TOKEN']
          for (const name of keys) if (!process.env[name]) throw new Error('Missing Preview secret: ' + name)
          // The account is pinned in void.config.ts; CI does not need interactive account discovery.
          mkdirSync('.void', { recursive: true })
          writeFileSync('.void/project.json', JSON.stringify({ platform: 'cloudflare' }))
          for (const name of keys) execFileSync('bun', ['x', 'void', 'secret', 'put', name], {
            input: process.env[name], stdio: ['pipe', 'inherit', 'inherit'],
          })
          NODE
      - name: Deploy dev through Void
        run: bun x void deploy --platform cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: liry
      - name: Preserve resolved resource IDs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: void-dev-lock
          path: void.lock.json
          if-no-files-found: ignore
