name: Branch Preview

on:
  push:
    branches-ignore: [main, 'renovate/**']
  delete:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      (github.event_name == 'push' || (github.event.ref_type == 'branch' && github.event.ref != 'main')) &&
      !startsWith(github.event_name == 'delete' && github.event.ref || github.ref_name, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun --no-env-file install --frozen-lockfile
      - if: github.event_name == 'push'
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
      - name: Check local SQLite development
        if: github.event_name == 'push'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BETTER_AUTH_SECRET: test-only-local-ci-secret-0123456789abcdef
          LIRY24_DEV_DB_PATH: ${{ runner.temp }}/liry24-local-test/database.sqlite
        run: |
          node node_modules/nuxt/bin/nuxt.mjs dev --host 127.0.0.1 --port 3101 > "$RUNNER_TEMP/nuxt-local.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true; wait "$dev_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/nuxt-local.log"' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3101/api/auth/get-session > /dev/null; then
              ready=true
              break
            fi
            kill -0 "$dev_pid" || exit 1
            sleep 1
          done
          test "$ready" = true
          node scripts/test-site-admin-local.mjs http://127.0.0.1:3101
      - name: Update Preview
        if: github.event_name == 'push'
        run: node scripts/preview.mjs deploy "$PREVIEW_BRANCH"
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          PREVIEW_GITHUB_CLIENT_ID: ${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}
          PREVIEW_GITHUB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
          PREVIEW_GITHUB_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
      - name: Delete Preview and storage
        if: github.event_name == 'delete'
        run: node scripts/preview.mjs delete "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
