name: Branch Preview

on:
  push:
    branches-ignore: [main]
  delete:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'push' || (github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'push'
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
      - name: Update Preview
        if: github.event_name == 'push'
        run: node scripts/preview.mjs deploy "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          PREVIEW_GITHUB_CLIENT_ID: ${{ secrets.PREVIEW_GITHUB_CLIENT_ID }}
          PREVIEW_GITHUB_CLIENT_SECRET: ${{ secrets.PREVIEW_GITHUB_CLIENT_SECRET }}
          PREVIEW_GITHUB_TOKEN: ${{ secrets.PREVIEW_GITHUB_TOKEN }}
      - name: Delete Preview and storage
        if: github.event_name == 'delete'
        run: node scripts/preview.mjs delete "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
